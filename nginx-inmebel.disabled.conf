# Staged config for /root/yapp/yapp_backend/nginx/nginx.conf.
# Do not include/reload until DNS is switched and certificates are issued.
#
# Required certs:
#   /etc/letsencrypt/live/inmebel.kz/
#   /etc/letsencrypt/live/api.inmebel.kz/
#   /etc/letsencrypt/live/admin.inmebel.kz/

upstream inmebel_frontend_upstream {
    server inmebel_frontend:3000;
}

upstream inmebel_api_upstream {
    server inmebel_api_nginx:80;
}

upstream inmebel_admin_upstream {
    server inmebel_admin_front:80;
}

server {
    listen 80;
    server_name inmebel.kz www.inmebel.kz api.inmebel.kz admin.inmebel.kz;

    location ^~ /.well-known/acme-challenge/ {
        alias /tmp/acme-challenge/;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name inmebel.kz www.inmebel.kz;

    ssl_certificate /etc/letsencrypt/live/inmebel.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inmebel.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://inmebel_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.inmebel.kz;

    ssl_certificate /etc/letsencrypt/live/api.inmebel.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.inmebel.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    location / {
        proxy_pass http://inmebel_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.inmebel.kz;

    ssl_certificate /etc/letsencrypt/live/admin.inmebel.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.inmebel.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    location ^~ /api/ {
        proxy_pass http://inmebel_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host api.inmebel.kz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://inmebel_admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
